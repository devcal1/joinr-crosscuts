name: Build and publish crosscuts-web

# Pull requests and pushes build and smoke-test the image on both architectures.
# Only a push to main publishes: each architecture pushes the exact image it
# just tested (by digest), and the merge job stitches the two digests into the
# :latest / :sha-<sha> multi-arch tags. This follows Docker's "distribute build
# across multiple runners" pattern.
on:
  push:
    branches: [main]
    paths:
      # crosscuts/** covers the app, the Dockerfile, the lockfile and the
      # manifest. The manifest has to be in the filter so a follow-up push that
      # only bumps version: (after the guard step below blocks a forgotten
      # bump) still triggers a publish.
      - "crosscuts/**"
      - "ci/**"
      - ".github/workflows/**"
  pull_request: {}
  workflow_dispatch: {}

# A new push cancels any still-running build for the same ref, rather than
# leaving an old run to hang around alongside a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/crosscuts-web

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    name: build-test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      # True only for a push to main: the only case that publishes.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Non-negotiable #1: Umbrel only offers an Update when version: changes,
      # so an app-code push without a bump would silently drift :latest away
      # from what the device runs. Fail fast instead.
      - name: Require a version bump for app changes
        if: github.event_name == 'push'
        run: |
          before='${{ github.event.before }}'
          # New branch or force-push with an unreachable before-SHA — nothing to compare.
          git rev-parse -q --verify "$before^{commit}" >/dev/null || exit 0
          git diff --quiet "$before" "${{ github.sha }}" -- crosscuts/app/ && exit 0
          git diff "$before" "${{ github.sha }}" -- crosscuts/umbrel-app.yml > /tmp/manifest.diff
          grep -q '^+version:' /tmp/manifest.diff && exit 0
          echo "crosscuts/app/ changed but umbrel-app.yml version: was not bumped — Umbrel would never offer this update." >&2
          exit 1

      - name: Prepare
        run: |
          platform='${{ matrix.platform }}'
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      # ci/smoke.sh needs curl and jq (both ship on GitHub's Ubuntu images).
      - name: Check smoke-test tooling
        run: |
          command -v curl >/dev/null || { sudo apt-get update && sudo apt-get install -y curl; }
          command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
          jq --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Native build for this runner's architecture (no QEMU).
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: crosscuts/app
          platforms: ${{ matrix.platform }}
          load: true
          tags: crosscuts-web:smoke-test
          provenance: false
          cache-from: type=gha,scope=crosscuts-${{ matrix.arch }}
          # ignore-error: a GHA cache-service hiccup during export must not
          # red a run whose build actually succeeded (the known step-8 issue).
          cache-to: type=gha,mode=max,scope=crosscuts-${{ matrix.arch }},ignore-error=true

      - name: Smoke test the built image
        run: bash ci/smoke.sh crosscuts-web:smoke-test

      # ---- publish (push to main only) -------------------------------------

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same context, platform and cache as the tested build above, so every
      # layer is a cache hit: the pushed image is built from the layers the
      # smoke test just ran, not a fresh rebuild.
      - name: Push the tested image by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: crosscuts/app
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=crosscuts-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=crosscuts-${{ matrix.arch }},ignore-error=true

      - name: Export digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.push.outputs.digest }}'
          [ -n "$digest" ] || { echo "No digest from the push step" >&2; exit 1; }
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge multi-arch manifest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          ls -1
          [ "$(ls -1 | wc -l)" -eq 2 ] || { echo "Expected 2 digests (amd64 + arm64)" >&2; exit 1; }
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            -t "$IMAGE:sha-${{ github.sha }}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "$IMAGE:sha-${{ github.sha }}"
