<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosscuts — Audit Log</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="audit.css">
</head>
<body>
  <div id="cc-shell"></div>

  <main class="page">
    <h1>Audit log</h1>
    <p class="text-muted">Read-only record of sign-ins, user changes and job changes. Times are Sydney local time. Entries can't be edited or deleted.</p>

    <form class="hs-card filters" id="filters" autocomplete="off">
      <div class="field">
        <label for="f-actor">User (id or username)</label>
        <input class="hs-input" id="f-actor" type="text" placeholder="e.g. 3 or todd">
      </div>
      <div class="field">
        <label for="f-action">Action</label>
        <select class="hs-input" id="f-action"><option value="">All actions</option></select>
      </div>
      <div class="field">
        <label for="f-etype">Entity type</label>
        <input class="hs-input" id="f-etype" type="text" placeholder="e.g. user, job">
      </div>
      <div class="field">
        <label for="f-eid">Entity id</label>
        <input class="hs-input" id="f-eid" type="text">
      </div>
      <div class="field">
        <label for="f-from">From</label>
        <input class="hs-input" id="f-from" type="date">
      </div>
      <div class="field">
        <label for="f-to">To</label>
        <input class="hs-input" id="f-to" type="date">
      </div>
      <div class="filter-buttons">
        <button class="hs-btn hs-btn-primary" type="submit">Apply</button>
        <button class="hs-btn" type="button" id="f-reset">Reset</button>
      </div>
    </form>

    <div class="status-line">
      <span class="text-muted" id="count">Loading…</span>
      <span class="spacer"></span>
      <span class="pager">
        <button class="hs-btn" id="prev" type="button">Previous</button>
        <span class="text-muted" id="page-info"></span>
        <button class="hs-btn" id="next" type="button">Next</button>
      </span>
    </div>

    <div class="table-wrap">
      <table class="audit-table hs-table">
        <thead>
          <tr><th class="col-chev"><span class="sr-only">Details</span></th><th>Time</th><th>Who</th><th>Action</th><th>Entity</th><th>IP</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty-state" id="empty" hidden>No audit entries match those filters.</div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="audit.js"></script>
  <script src="/shell/shell.js"></script>
</body>
</html>
