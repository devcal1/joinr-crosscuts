<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overdue accounts - Crosscuts</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="accounts.css">
  <script src="/shell/busy.js"></script>
</head>
<body>
  <div id="cc-shell"></div>

  <main class="ac-page">
    <div class="ac-head">
      <h1>Overdue accounts</h1>
      <button id="newInvoice" class="hs-btn hs-btn-primary" type="button" hidden>New invoice</button>
      <button id="addExtra" class="hs-btn" type="button" hidden>Add extra</button>
    </div>

    <div class="ac-views" role="group" aria-label="View">
      <button id="viewTable" class="hs-btn hs-btn-primary" type="button" aria-pressed="true">Invoice table</button>
      <button id="viewOverdue" class="hs-btn" type="button" aria-pressed="false">Overdue list</button>
    </div>

    <section id="tableView">
      <div class="ac-tools">
        <div id="filters" class="ac-filters" role="group" aria-label="Filter invoices"></div>
        <input id="q" class="hs-input ac-search" type="search" placeholder="Search client, job, address or number" autocomplete="off" aria-label="Search">
        <label class="ac-check"><input id="allJobs" type="checkbox"> Show all jobs</label>
      </div>
      <p id="totals" class="ac-totals" role="status" aria-live="polite">Loading...</p>
      <div class="ac-wrap">
        <table class="hs-table ac-table">
          <thead>
            <tr>
              <th>Job</th><th>Client</th><th class="num">Value</th>
              <th>Deposit</th><th>Progress</th><th>Final</th><th>Extras</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="ac-empty" hidden></div>
      </div>
    </section>

    <section id="overdueView" hidden>
      <p id="overdueSummary" class="ac-totals" role="status" aria-live="polite">Loading...</p>
      <!-- 0.2.7 (m28-contracts.md section 3): the default follow-up interval and each client's terms. -->
      <details id="followupBox" class="ac-fubox" hidden>
        <summary>Follow-up intervals</summary>
        <div id="followupBody"></div>
      </details>
      <div class="ac-wrap">
        <table class="hs-table ac-table ac-overdue">
          <thead>
            <tr>
              <th>Number</th><th>Job</th><th>Client</th><th>Phone</th><th class="num">Amount</th>
              <th>Due</th><th class="num">Days overdue</th><th>Last contacted</th><th>Follow-up notes</th><th></th>
            </tr>
          </thead>
          <tbody id="overdueRows"></tbody>
        </table>
        <div id="overdueEmpty" class="ac-empty" hidden>Nothing is overdue.</div>
      </div>
    </section>
  </main>

  <dialog id="dlg" class="cc-dialog ac-dialog" aria-labelledby="dlgTitle"></dialog>

  <script src="shared.js"></script>
  <script src="accounts.js"></script>
  <script src="/shell/shell.js"></script>
</body>
</html>
