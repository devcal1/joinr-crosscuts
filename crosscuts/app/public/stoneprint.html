<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stone order print - Crosscuts</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="stoneprint.css">
  <script src="/shell/busy.js"></script>
</head>
<body class="sp-body">
  <div id="cc-shell"></div>

  <!-- The stone order and benchtop sheet prints (stoneprint.js; docs/plans/m12-contracts.md
       sections 7 and 9.3): the sheet as it will print, on a white paper box. -->
  <main class="sp-page">
    <div class="sp-toolbar">
      <button id="spPrint" class="hs-btn hs-btn-primary" type="button" disabled>Print</button>
      <a id="spBack" class="hs-btn" href="/">Back</a>
      <p id="spStatus" class="sp-status" role="status" aria-live="polite"></p>
    </div>
    <div class="sp-scroll">
      <article id="spSheet" class="sp-sheet" aria-label="Sheet">
        <p class="sp-loading">Loading...</p>
      </article>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="/shell/shell.js"></script>
  <script src="stoneprint.js"></script>
</body>
</html>
