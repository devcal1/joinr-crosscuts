<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job - Crosscuts</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="orderui.css">
<link rel="stylesheet" href="jobs.css">
<link rel="stylesheet" href="tasks.css">
<link rel="stylesheet" href="drawerspage.css">
</head>
<body>
  <div id="cc-shell"></div>

  <main class="jobs-page narrow">
    <div class="jobs-head">
      <h1 id="title">Job</h1>
      <a class="hs-btn" href="/jobs.html">All jobs</a>
    </div>
    <div id="banner"></div>
    <div id="meta" class="metaline muted"></div>
    <form id="form" class="jobform" novalidate></form>

    <section id="joinr" class="jo-sec" aria-labelledby="joinr-h" hidden>
      <div class="hs-sectionbar">
        <h2 id="joinr-h">From Joinr</h2>
      </div>
      <p id="joinrStatus" class="jo-status muted" role="status"></p>
      <div id="joinrBody"></div>
    </section>

    <section id="orders" class="jo-sec" aria-labelledby="orders-h" hidden>
      <div class="hs-sectionbar">
        <h2 id="orders-h">Orders</h2>
        <button id="showCancelled" class="hs-btn hs-btn-quiet" type="button" aria-pressed="false">Show cancelled</button>
      </div>
      <div id="ordersSummary" class="jo-summary"></div>
      <p id="ordersStatus" class="jo-status muted" role="status"></p>
      <div id="ordersBody"></div>
      <div id="drawersBlock" class="dw-jblock" hidden>
        <div class="dw-jhead">
          <h3 id="drawers-h" tabindex="-1">Drawers</h3>
          <button id="addDrawers" class="hs-btn hs-btn-primary" type="button" hidden>Add drawers</button>
        </div>
        <p id="drawersStatus" class="jo-status muted" role="status"></p>
        <div id="drawersBody"></div>
      </div>
      <form id="orderForm" class="jo-form" novalidate hidden>
        <h3 class="jo-formh">Add a line</h3>
        <div class="jo-grid">
          <div class="jo-field">
            <label for="oSupplier">Supplier *</label>
            <input id="oSupplier" class="hs-input" type="text" list="oSuppliers" maxlength="200" autocomplete="off">
            <datalist id="oSuppliers"></datalist>
          </div>
          <div class="jo-field">
            <label for="oExpected">Expected</label>
            <input id="oExpected" class="hs-input" type="date">
          </div>
          <div class="jo-field jo-wide">
            <label for="oDesc">Description</label>
            <input id="oDesc" class="hs-input" type="text" maxlength="500" autocomplete="off">
          </div>
          <div class="jo-field jo-wide">
            <label for="oNotes">Notes</label>
            <input id="oNotes" class="hs-input" type="text" autocomplete="off">
          </div>
        </div>
        <div class="jo-actions"><button id="oAdd" class="hs-btn hs-btn-primary" type="submit">Add line</button></div>
      </form>
    </section>

    <section id="inspection" class="jo-sec" aria-labelledby="inspection-h" hidden>
      <div class="hs-sectionbar">
        <h2 id="inspection-h">Inspection</h2>
      </div>
      <p id="inspectionStatus" class="jo-status muted" role="status"></p>
      <div id="inspectionBody"></div>
      <form id="inspectionForm" class="jo-form" novalidate hidden>
        <h3 class="jo-formh">Book an inspection</h3>
        <div class="jo-grid">
          <div class="jo-field">
            <label for="iDate">Date *</label>
            <input id="iDate" class="hs-input" type="date">
          </div>
          <div class="jo-field">
            <label for="iTime">Time</label>
            <input id="iTime" class="hs-input" type="time">
          </div>
          <div class="jo-field">
            <label for="iHost">Host</label>
            <input id="iHost" class="hs-input" type="text" maxlength="200" autocomplete="off">
          </div>
          <div class="jo-field">
            <label for="iNotes">Notes</label>
            <input id="iNotes" class="hs-input" type="text" autocomplete="off">
          </div>
        </div>
        <div class="jo-actions"><button id="iBook" class="hs-btn hs-btn-primary" type="submit">Book inspection</button></div>
      </form>
    </section>

    <section id="planner" class="jo-sec" aria-labelledby="planner-h" hidden>
      <div class="hs-sectionbar">
        <h2 id="planner-h">Planner</h2>
        <a class="hs-btn hs-btn-quiet" href="/planner.html">Open planner</a>
      </div>
      <p id="plannerStatus" class="jo-status muted" role="status"></p>
      <div id="plannerBody"></div>
    </section>

    <section id="photos" class="jo-sec" aria-labelledby="photos-h" hidden>
      <div class="hs-sectionbar">
        <h2 id="photos-h">Photos</h2>
      </div>
      <p id="photosStatus" class="jo-status muted" role="status"></p>
      <div id="photosBody"></div>
      <form id="photoForm" class="jo-form" novalidate hidden>
        <h3 class="jo-formh">Upload photos</h3>
        <div class="jo-grid">
          <div class="jo-field jo-wide">
            <label for="pFiles">Photos</label>
            <input id="pFiles" class="hs-input" type="file" accept="image/*" multiple>
          </div>
          <div class="jo-field jo-wide">
            <label for="pTags">Tags</label>
            <input id="pTags" class="hs-input" type="text" placeholder="kitchen, white oak" autocomplete="off">
          </div>
        </div>
        <div class="jo-actions"><button id="pUpload" class="hs-btn hs-btn-primary" type="submit">Upload photos</button></div>
      </form>
    </section>

    <section id="tasks" class="jo-sec" aria-labelledby="tasks-h" hidden>
      <div class="hs-sectionbar">
        <h2 id="tasks-h">Tasks</h2>
        <button id="newTask" class="hs-btn hs-btn-primary" type="button">New task</button>
      </div>
      <p id="tasksStatus" class="jo-status muted" role="status"></p>
      <div id="tasksBody"></div>
    </section>

    <section id="comments" class="jo-sec" aria-labelledby="comments-h" hidden>
      <div class="hs-sectionbar">
        <h2 id="comments-h">Comments</h2>
      </div>
      <div id="commentsBody" class="jo-comments"></div>
    </section>

    <section id="invoices" class="jobinv" aria-labelledby="invoices-h" hidden>
      <div class="hs-sectionbar">
        <h2 id="invoices-h">Invoices</h2>
        <a class="hs-btn hs-btn-quiet" href="/accounts.html">Accounts</a>
      </div>
      <div id="invoicesBody"></div>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="comments.js"></script>
  <script src="taskui.js"></script>
  <script src="orderui.js"></script>
  <script src="drawers.js"></script>
  <script src="job.js"></script>
  <script src="/shell/shell.js"></script>
</body>
</html>
