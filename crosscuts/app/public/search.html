<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TH Cabinets — Job Photo Search</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="search.css">
</head>
<body>
  <div class="hs-rule"></div>

  <div class="hero">
    <div class="hero-top"><a class="hs-btn hero-home" href="/">Dashboard</a></div>
    <div class="hero-lockup">
      <span class="hs-lockup">TH <b>CABINETS</b></span>
      <span class="hero-sub">Job photo search</span>
    </div>
    <div class="search-wrap">
      <input class="hs-input" id="search-input" type="text" placeholder="Dream in oak, ask in words..." autocomplete="off" aria-label="Search photos">
    </div>
    <div class="tg-chips" id="tg-chips" role="group" aria-label="Filter by tag" hidden></div>
  </div>

  <div class="results">
    <div class="result-count">
      <span class="text-muted" id="result-count" role="status">Loading…</span>
    </div>
    <div class="grid" id="grid"></div>
    <div class="empty-state" id="empty-state" style="display:none">
      No photos match those filters.
    </div>
  </div>

  <div class="dialog-backdrop" id="lightbox">
    <div class="dialog" id="lightbox-dialog" role="dialog" aria-modal="true" aria-label="Photo viewer">
      <img id="lightbox-img" src="" alt="">
      <button class="hs-btn" id="lightbox-close" type="button">Close</button>
    </div>
  </div>

  <div class="hs-rule"></div>

  <script src="vendor/fuse.min.js"></script>
  <script src="search.js"></script>
</body>
</html>
