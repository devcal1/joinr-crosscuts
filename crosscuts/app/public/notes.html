<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Notes - Crosscuts</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="notes.css">
</head>
<body class="nt-body">
  <div id="cc-shell"></div>

  <main class="nt-page">
    <div class="nt-head">
      <h1 id="title">Notes</h1>
      <p id="sub" class="nt-hint">Notes for the people in this department. Each week starts a fresh sheet.</p>
    </div>

    <p id="message" class="nt-message" role="status" hidden></p>

    <div id="sheets" hidden>
      <section class="nt-week" aria-labelledby="thisHead">
        <h2 id="thisHead" class="nt-week-head">This week <span id="thisLabel" class="nt-week-of"></span></h2>
        <form id="composer" class="nt-composer" autocomplete="off">
          <label class="nt-sr" for="body">New note</label>
          <textarea id="body" class="hs-input nt-body-input" rows="3" maxlength="2000" placeholder="Leave a note for the team"></textarea>
          <div class="nt-composer-row">
            <span id="count" class="nt-count"></span>
            <button id="add" type="submit" class="hs-btn hs-btn-primary">Add note</button>
          </div>
        </form>
        <p id="error" class="nt-error" role="alert"></p>
        <ol id="thisList" class="nt-list"></ol>
        <p id="thisEmpty" class="nt-empty" hidden>No notes</p>
      </section>

      <section class="nt-week" aria-labelledby="lastHead">
        <h2 id="lastHead" class="nt-week-head">Last week <span id="lastLabel" class="nt-week-of"></span></h2>
        <ol id="lastList" class="nt-list"></ol>
        <p id="lastEmpty" class="nt-empty" hidden>No notes</p>
      </section>

      <div id="older"></div>
      <div class="nt-more-wrap">
        <button id="olderBtn" type="button" class="hs-btn" hidden>Older weeks</button>
      </div>
    </div>
  </main>

  <script src="shared.js"></script>
  <script src="notes.js"></script>
  <script src="/shell/shell.js"></script>
</body>
</html>
