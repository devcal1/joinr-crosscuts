<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders - Crosscuts</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="orderui.css">
<link rel="stylesheet" href="orders.css">
<link rel="stylesheet" href="jobcards.css">
<link rel="stylesheet" href="supplierorders.css">
<link rel="stylesheet" href="stockorders.css">
  <script src="/shell/busy.js"></script>
</head>
<body>
  <div id="cc-shell"></div>

  <main class="or-page">
    <div class="or-head">
      <h1 id="orTitle" tabindex="-1">Orders</h1>
      <div class="jc-headbtns" id="jcHeadBtns">
        <button type="button" id="jcNew" class="hs-btn hs-btn-primary" hidden>New job card</button>
        <button type="button" id="soNew" class="hs-btn hs-btn-primary" hidden>New supplier order</button>
      </div>
    </div>

    <!-- 0.2.23: shown after Mark ordered on a supplier order (supplierorder.js). -->
    <div id="poSaved" class="po-ok" role="status" hidden></div>

    <div class="jc-tabs" id="jcTabs" role="tablist" aria-label="Orders views">
      <button type="button" role="tab" id="tabCards" class="jc-tab" aria-selected="true" aria-controls="viewCards">Job cards</button>
      <button type="button" role="tab" id="tabPos" class="jc-tab" aria-selected="false" aria-controls="viewPos" tabindex="-1">Supplier orders</button>
      <button type="button" role="tab" id="tabLines" class="jc-tab" aria-selected="false" aria-controls="viewLines" tabindex="-1">All order lines</button>
    </div>

    <!-- ===================== Job cards (default) ===================== -->
    <section id="viewCards" role="tabpanel" aria-labelledby="tabCards">
      <!-- 0.2.27: the Stock section (stockorders.js): one stock order a month, month cards, items by supplier. -->
      <section id="skSection" class="sk" aria-labelledby="skTitle" hidden>
        <div class="sk-bar">
          <h2 id="skTitle">Stock</h2>
          <div class="sk-nav">
            <button type="button" id="skPrev" class="hs-btn">Previous month</button>
            <button type="button" id="skNow" class="hs-btn">This month</button>
            <button type="button" id="skNext" class="hs-btn">Next month</button>
          </div>
          <div class="sk-push"><button type="button" id="skPrint" class="hs-btn">Print month</button></div>
        </div>
        <p id="skMessage" class="or-message" role="status"></p>
        <p id="skCount" class="sk-count" role="status" aria-live="polite"></p>
        <div id="skCards" class="sk-cards"></div>
        <section id="skOpen" class="sk-open sk-col sk-cur" aria-labelledby="skOpenTitle" hidden>
          <div class="sk-h"><h3 id="skOpenTitle" tabindex="-1"></h3><span id="skTag" class="sk-tag"></span></div>
          <div id="skGroups"></div>
          <form id="skAddForm" class="sk-add" novalidate hidden>
            <div class="sk-addrow">
              <div class="sk-ta"><input id="skAddSupplier" class="hs-input" type="text" maxlength="200" autocomplete="off" placeholder="Supplier" aria-label="Supplier"></div>
              <div class="sk-ta"><input id="skAddItem" class="hs-input" type="text" maxlength="500" autocomplete="off" placeholder="Item" aria-label="Item"></div>
              <div class="sk-ta sk-qty"><input id="skAddQty" class="hs-input" type="text" inputmode="decimal" maxlength="9" autocomplete="off" placeholder="Qty" aria-label="Quantity"></div>
              <button type="submit" id="skAddBtn" class="hs-btn">Add item</button>
            </div>
            <p id="skAddError" class="cc-dialog-error" role="alert"></p>
          </form>
        </section>
      </section>
      <div class="sk-bar sk-jobsbar"><h2>Job cards</h2></div>
      <div class="jc-tools">
        <div class="or-filter jc-find">
          <label for="jcFind">Find a job</label>
          <input id="jcFind" class="hs-input" type="search" placeholder="Job number, name or client" autocomplete="off">
        </div>
        <div class="or-filter">
          <label for="jcSupplier">Supplier</label>
          <select id="jcSupplier" class="hs-input">
            <option value="">All suppliers</option>
          </select>
        </div>
        <label class="jc-check" for="jcFinished"><input id="jcFinished" type="checkbox"> Show finished cards (everything received)</label>
      </div>
      <p id="jcCount" class="or-count" role="status" aria-live="polite">Loading...</p>
      <p id="jcMessage" class="or-message" role="status"></p>
      <div id="jcGrid" class="jc-grid"></div>
      <section id="jcPanel" class="jc-panel" aria-label="Job card" hidden></section>
    </section>

    <!-- ===================== Supplier orders (saved purchase orders, 0.2.23) ===================== -->
    <section id="viewPos" role="tabpanel" aria-labelledby="tabPos" hidden>
      <div class="jc-tools">
        <div class="or-filter jc-find">
          <label for="poFind">Find an order</label>
          <input id="poFind" class="hs-input" type="search" placeholder="PO number, supplier ref or job" autocomplete="off">
        </div>
        <div class="or-filter">
          <label for="poSupplier">Supplier</label>
          <select id="poSupplier" class="hs-input">
            <option value="">All suppliers</option>
          </select>
        </div>
      </div>
      <p id="poCount" class="or-count" role="status" aria-live="polite">Loading...</p>
      <p id="poMessage" class="or-message" role="status"></p>
      <div class="jc-panel po-list" id="poListBox" hidden>
        <div class="jc-pwrap">
          <table class="hs-table jc-table po-table">
            <thead>
              <tr>
                <th scope="col">Order</th><th scope="col">Supplier</th><th scope="col">Order date</th><th scope="col">Expected</th>
                <th scope="col">Supplier ref</th><th scope="col" class="jc-num">Items</th><th scope="col">Jobs</th><th scope="col">By</th>
                <th scope="col"><span class="jc-sr">Open</span></th>
              </tr>
            </thead>
            <tbody id="poRows"></tbody>
          </table>
        </div>
      </div>
      <section id="poPanel" class="jc-panel" aria-label="Supplier order" hidden></section>
    </section>

    <!-- ===================== All order lines (today's list) ===================== -->
    <section id="viewLines" role="tabpanel" aria-labelledby="tabLines" hidden>
      <div class="or-tools">
        <div class="or-filter">
          <label for="status">Status</label>
          <select id="status" class="hs-input">
            <option value="open">Open</option>
            <option value="to_order">To order</option>
            <option value="ordered">Ordered</option>
            <option value="received">Received</option>
            <option value="cancelled">Cancelled</option>
            <option value="all">All</option>
            <option value="deleted" id="statusDeleted" hidden disabled>Deleted</option>
          </select>
        </div>
        <div class="or-filter">
          <label for="supplier">Supplier</label>
          <select id="supplier" class="hs-input">
            <option value="">All suppliers</option>
          </select>
        </div>
        <!-- 0.2.2 (m23-contracts section 5): ?job=N, from the order manager's alert. -->
        <p id="jobFilter" class="or-jobfilter" hidden></p>
      </div>

      <p id="count" class="or-count" role="status" aria-live="polite">Loading...</p>
      <p id="message" class="or-message" role="status"></p>

      <div class="or-wrap">
        <table class="hs-table or-table">
          <thead>
            <tr>
              <th scope="col">Job</th><th scope="col">Supplier</th><th scope="col">Description</th><th scope="col" class="or-numh">Qty</th><th scope="col">Status</th>
              <th scope="col">Expected</th><th scope="col">Ordered</th><th scope="col">Received</th><th scope="col">Notes</th>
              <th scope="col" id="actionsHead" hidden>Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="or-empty" hidden></div>
      </div>
    </section>

    <!-- ===================== New supplier order ===================== -->
    <section id="viewSupplier" aria-label="New supplier order" hidden>
      <div class="jc-tools">
        <div class="or-filter so-supfield">
          <label for="soSupplier">Supplier</label>
          <select id="soSupplier" class="hs-input"></select>
        </div>
        <button type="button" id="soBack" class="hs-btn">Back to job cards</button>
      </div>
      <p id="soMessage" class="or-message" role="status"></p>
      <p id="soEmpty" class="or-empty" hidden>Nothing is waiting to be ordered from a supplier.</p>
      <section id="soPanel" class="jc-panel so-panel" hidden>
        <div class="so-wrap">
          <table class="hs-table jc-table so-table">
            <thead>
              <tr>
                <th scope="col" class="so-tick"><input type="checkbox" id="soAll" aria-label="Tick all"></th>
                <th scope="col">Hardware</th><th scope="col" class="jc-num">Qty</th><th scope="col">Added</th><th scope="col">Notes</th>
              </tr>
            </thead>
            <tbody id="soRows"></tbody>
          </table>
        </div>
        <div class="jc-foot">
          <div class="or-filter so-date">
            <label for="soDate">Order date</label>
            <input id="soDate" class="hs-input" type="date">
          </div>
          <div class="or-filter so-date" id="soExpectedBox">
            <label for="soExpected">Expected (optional)</label>
            <input id="soExpected" class="hs-input" type="date">
          </div>
          <div class="or-filter so-ref" id="soRefBox">
            <label for="soRef">Supplier ref (optional)</label>
            <input id="soRef" class="hs-input" type="text" maxlength="100" placeholder="e.g. their order number" autocomplete="off">
          </div>
          <div class="jc-footpush">
            <span id="soSum" class="jc-sum"></span>
            <button type="button" id="soPrint" class="hs-btn">Print list</button>
            <button type="button" id="soMark" class="hs-btn hs-btn-primary" hidden>Mark ordered</button>
          </div>
        </div>
      </section>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="/periods.js"></script>
  <script src="/shell/shell.js"></script>
  <script src="orderui.js"></script>
  <script src="orders.js"></script>
  <script src="jobcards.js"></script>
  <script src="stockorders.js"></script>
  <script src="supplierorder.js"></script>
  <script src="supplierorders.js"></script>
</body>
</html>
