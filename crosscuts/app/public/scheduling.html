<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scheduling - Crosscuts</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="scheduling.css">
</head>
<body>
  <div id="cc-shell"></div>

  <main class="dash">
    <header class="dash-head">
      <h1>Scheduling</h1>
      <p class="dash-date" id="range" hidden></p>
    </header>

    <section class="dash-section" aria-labelledby="upcoming-h">
      <div class="hs-sectionbar"><h2 class="dash-h2" id="upcoming-h">Upcoming, next 14 days</h2></div>
      <p id="scMessage" class="sc-message" role="status"></p>

      <h3 class="sc-h3" id="insp-h">Inspections</h3>
      <div id="scInspections" aria-labelledby="insp-h"><p class="sc-empty">Loading...</p></div>

      <h3 class="sc-h3" id="mat-h">Materials expected</h3>
      <div id="scMaterials" aria-labelledby="mat-h"><p class="sc-empty">Loading...</p></div>

      <h3 class="sc-h3" id="matin-h">Materials in</h3>
      <div id="scMaterialsIn" aria-labelledby="matin-h"><p class="sc-empty">Loading...</p></div>
    </section>

  </main>

  <script src="shared.js"></script>
  <script src="scheduling.js"></script>
  <script src="shell/shell.js"></script>
</body>
</html>
