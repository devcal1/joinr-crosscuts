<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosscuts</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="cc-shell"></div>

  <main class="dash">
    <header class="dash-head">
      <h1 id="greeting">Hello</h1>
      <p class="dash-date" id="today"></p>
    </header>

    <a class="week-line hs-callout" id="week-line" href="/schedule.html" hidden></a>

    <section class="dash-section" aria-labelledby="depts-h">
      <div class="hs-sectionbar"><h2 class="dash-h2" id="depts-h">Your departments</h2></div>
      <div class="tiles" id="tiles"></div>
      <p class="dash-empty" id="tiles-empty" hidden>Nothing has been switched on for your account yet. Ask an administrator which sections you should see.</p>
    </section>

    <section class="dash-section" aria-labelledby="later-h">
      <div class="hs-sectionbar"><h2 class="dash-h2" id="later-h">Coming later</h2></div>
      <div class="tiles">
        <article class="tile tile-later hs-card">
          <h3 class="tile-title">My tasks</h3>
          <p class="tile-text">Tasks assigned to you will collect here.</p>
          <p class="tile-badge hs-badge hs-badge-na">Coming in a later update</p>
        </article>
        <article class="tile tile-later hs-card">
          <h3 class="tile-title">Notifications</h3>
          <p class="tile-text">Messages and alerts will show here.</p>
          <p class="tile-badge hs-badge hs-badge-na">Coming in a later update</p>
        </article>
      </div>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="shell/shell.js"></script>
  <script src="index.js"></script>
</body>
</html>
