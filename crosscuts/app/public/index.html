<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crosscuts</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="index.css">
</head>
<body>
  <div id="cc-shell"></div>

  <main class="dash">
    <header class="dash-head">
      <h1 id="greeting">Hello</h1>
      <p class="dash-date" id="today"></p>
    </header>

    <div class="dash-lines">
      <a class="week-line hs-callout" id="week-line" href="/schedule.html" hidden></a>
      <a class="week-line hs-callout" id="accounts-line" href="/accounts.html" hidden></a>
      <a class="week-line hs-callout" id="deliveries-line" href="/deliveries.html" hidden></a>
      <!-- index.js adds the stock, board and drawer lines here (stock.count, stock.order) -->
    </div>

    <p class="dash-hint" id="menu-hint" hidden></p>

    <section class="dash-section" id="alerts-section" aria-labelledby="alerts-h" hidden>
      <div class="hs-sectionbar">
        <h2 class="dash-h2" id="alerts-h">Notifications</h2>
        <button class="hs-btn hs-btn-quiet" type="button" id="alerts-all">See all</button>
      </div>
      <div class="hs-card alerts-card">
        <ul class="alerts-list" id="alerts-list"></ul>
        <p class="alerts-empty" id="alerts-empty" hidden>No alerts</p>
      </div>
    </section>

    <section class="dash-section" id="work-section" aria-labelledby="work-h" hidden>
      <div class="hs-sectionbar"><h2 class="dash-h2" id="work-h">Your work</h2></div>
      <div class="tiles">
        <article class="tile hs-card ix-tile" id="ix-planner" aria-labelledby="ix-planner-h" hidden>
          <h3 class="tile-title" id="ix-planner-h">Planner</h3>
          <ul class="ix-list" id="ix-planner-list"></ul>
          <p class="ix-empty" id="ix-planner-empty" hidden>Nothing on today or tomorrow.</p>
          <div class="tile-links"><a class="hs-btn" href="/planner.html">Open planner</a></div>
        </article>
        <article class="tile hs-card ix-tile" id="ix-tasks" aria-labelledby="ix-tasks-h" hidden>
          <h3 class="tile-title" id="ix-tasks-h">My tasks</h3>
          <ul class="ix-list" id="ix-tasks-list"></ul>
          <p class="ix-empty" id="ix-tasks-empty" hidden>Nothing assigned to you.</p>
          <div class="tile-links"><a class="hs-btn" href="/tasks.html">All my tasks</a></div>
        </article>
        <article class="tile hs-card ix-tile" id="ix-messages" aria-labelledby="ix-messages-h" hidden>
          <h3 class="tile-title" id="ix-messages-h">Messages</h3>
          <ul class="ix-list" id="ix-messages-list"></ul>
          <p class="ix-empty" id="ix-messages-empty" hidden>No channels to show.</p>
          <div class="tile-links"><a class="hs-btn" href="/messages.html">Open messages</a></div>
        </article>
      </div>
    </section>
  </main>

  <script src="shared.js"></script>
  <script src="shell/shell.js"></script>
  <script src="index.js"></script>
</body>
</html>
