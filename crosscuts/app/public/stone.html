<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Benchtops - Crosscuts</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="orderui.css">
<link rel="stylesheet" href="stone.css">
  <script src="/shell/busy.js"></script>
</head>
<body>
  <div id="cc-shell"></div>

  <main class="so-page" id="soPage">
    <div class="so-head">
      <h1 id="soTitle" tabindex="-1">Benchtops</h1>
      <div id="soHeadActions" class="so-head-actions"></div>
    </div>
    <p id="soStatus" class="so-status" role="status" aria-live="polite">Loading...</p>

    <!-- The list (/stone.html): open, cancelled or all, kept in the hash -->
    <section id="soList" class="so-list" aria-labelledby="soTitle" hidden>
      <p class="so-intro">Start a stone order from its job's Benchtops section.</p>
      <div class="so-tools">
        <label class="so-inline">
          <span class="hs-label">Show</span>
          <select id="soFilter" class="hs-input so-filter">
            <option value="open">Open</option>
            <option value="cancelled">Cancelled</option>
            <option value="all">All</option>
          </select>
        </label>
      </div>
      <p id="soEmpty" class="so-empty" hidden></p>
      <div id="soListWrap" class="so-wrap" hidden>
        <table class="so-table so-table-list">
          <thead>
            <tr>
              <th scope="col" class="so-c-job">Job</th>
              <th scope="col" class="so-c-sup">Supplier</th>
              <th scope="col" class="so-c-stone">Stone</th>
              <th scope="col" class="so-c-state">State</th>
              <th scope="col" class="so-c-date">Measure</th>
              <th scope="col" class="so-c-date">Requested install</th>
              <th scope="col" class="so-c-open"><span class="so-sr">Open</span></th>
            </tr>
          </thead>
          <tbody id="soRows"></tbody>
        </table>
      </div>
    </section>

    <!-- 0.2.0 (docs/plans/m21-benchtop-designer.md): the benchtop plans, one per job (benchtopplans.js) -->
    <section id="bpList" class="so-list" aria-labelledby="bpListH" hidden>
      <div class="bp-head">
        <h2 id="bpListH" class="so-plansh">Benchtop plans</h2>
        <button type="button" id="bpNew" class="hs-btn hs-btn-primary" aria-expanded="false" aria-controls="bpPick" hidden>New benchtop plan</button>
      </div>
      <!-- 0.2.21: start a plan here. Pick a job; a job with a plan opens that plan (one per job). -->
      <div id="bpPick" class="bp-pick" hidden>
        <label class="so-inline bp-pickfield">
          <span class="hs-label">Job for the new plan</span>
          <input id="bpPickIn" class="hs-input" type="search" autocomplete="off" placeholder="Job number, name or client"
            role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="bpPickList">
        </label>
        <ul id="bpPickList" class="bp-picklist" role="listbox" aria-label="Jobs" hidden></ul>
        <button type="button" id="bpPickCancel" class="hs-btn">Cancel</button>
      </div>
      <div class="so-tools">
        <label class="so-inline">
          <span class="hs-label">Find a plan</span>
          <input id="bpFind" class="hs-input bp-find" type="search" autocomplete="off" placeholder="Job number, job, client or project manager">
        </label>
      </div>
      <p id="bpEmpty" class="so-empty" hidden>No benchtop plans yet.</p>
      <div id="bpWrap" class="so-wrap" hidden>
        <table class="so-table so-table-list">
          <thead><tr><th scope="col">Job no.</th><th scope="col">Job</th><th scope="col">Client</th><th scope="col">Project manager</th><th scope="col">Pieces</th><th scope="col">Revision</th><th scope="col">Updated</th><th scope="col"><span class="so-sr">Open</span></th></tr></thead>
          <tbody id="bpRows"></tbody>
        </table>
      </div>
    </section>

    <!-- One stone order (?id=N) or a new one for a job (?job=N), built by stone.js -->
    <section id="soOrder" class="so-order" aria-labelledby="soTitle" hidden></section>
  </main>

  <script src="shared.js"></script>
  <script src="/shell/shell.js"></script>
  <script src="orderui.js"></script>
  <script src="stone.js"></script>
  <script src="benchtopplans.js"></script>
</body>
</html>
